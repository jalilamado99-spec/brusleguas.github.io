<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo - Mi Blog</title>
    <style>
        :root {
            --color-primario: #2c3e50;
            --color-secundario: #e74c3c;
            --color-fondo: #fafafa;
            --fuente-normal: 18px;
        }
        
        body {
            font-family: 'Georgia', serif;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: var(--color-fondo);
            color: #333;
            font-size: var(--fuente-normal);
        }
        
        .volver {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--color-secundario);
            text-decoration: none;
            font-size: 18px;
        }
        
        article {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: var(--color-primario);
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .meta {
            color: #7f8c8d;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--color-secundario);
        }
        
        img { max-width: 100%; height: auto; border-radius: 8px; }
        .dialogo {
            background: #f0f0f0;
            padding: 20px;
            border-left: 4px solid #3498db;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>
    <a href="index.html" class="volver">← Volver al inicio</a>
    
    <article>
        <div id="contenido" style="text-align: center; padding: 40px;">
            Cargando artículo...
        </div>
    </article>
    
    <script>
        // CAMBIA ESTO CON TUS DATOS
        const BLOG_CONFIG = {
            user: 'brusleguas',
            repo: 'mi-blog'
        };
        
        async function cargarArticulo() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            
            if (!slug) {
                document.getElementById('contenido').innerHTML = 'Artículo no especificado';
                return;
            }
            
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${BLOG_CONFIG.user}/${BLOG_CONFIG.repo}/main/posts/${slug}.json`);
                
                if (!response.ok) throw new Error('No encontrado');
                
                const articulo = await response.json();
                const fecha = new Date(articulo.fecha).toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                document.getElementById('contenido').innerHTML = `
                    <h1>${articulo.titulo}</h1>
                    <div class="meta">📅 ${fecha} | ✍️ ${articulo.autor}</div>
                    ${articulo.contenido}
                `;
                
                document.title = `${articulo.titulo} - Mi Blog`;
                
            } catch (error) {
                document.getElementById('contenido').innerHTML = `
                    <h1>Error</h1>
                    <p>No se pudo cargar el artículo</p>
                `;
            }
        }
        
        cargarArticulo();
    </script>
</body>
</html>
