<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo · Blog Formal</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ===== MISMAS VARIABLES QUE EL INDEX ===== */
        :root {
            /* COLORES PRINCIPALES - Cámbialos a tu gusto */
            --color-primario: #1e3c4f;        /* Azul oscuro principal */
            --color-secundario: #d98c3b;       /* Naranja/accento */
            --color-fondo: #f8fafc;            /* Fondo general */
            --color-texto: #2c4058;             /* Color de texto principal */
            --color-texto-claro: #5a6f7d;       /* Texto secundario */
            --color-borde: #e9ecef;              /* Color de bordes */
            
            /* TIPOGRAFÍA */
            --fuente-titulos: 'Playfair Display', Georgia, serif;
            --fuente-texto: 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
            
            /* TAMAÑOS */
            --tamano-titulo-articulo: 2.5em;
            --tamano-texto: 1.2em;
            --tamano-texto-pequeno: 0.95em;
            
            /* ESPACIADO */
            --espaciado-general: 20px;
            --borde-radio: 20px;
            
            /* SOMBRAS */
            --sombra-suave: 0 10px 30px rgba(0,0,0,0.05);
            --sombra-fuerte: 0 20px 40px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fuente-texto);
            background: var(--color-fondo);
            color: var(--color-texto);
            line-height: 1.8;
        }

        /* ===== HEADER ===== */
        .site-header {
            background: linear-gradient(135deg, var(--color-primario) 0%, #2c5a7a 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            border-bottom: 5px solid var(--color-secundario);
            box-shadow: var(--sombra-fuerte);
        }

        .site-header h1 {
            font-size: 2.5em;
            font-weight: 500;
            margin-bottom: 10px;
            font-family: var(--fuente-titulos);
        }

        .back-link {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--color-secundario);
        }

        @media (max-width: 768px) {
            .back-link {
                position: static;
                transform: none;
                justify-content: center;
                margin-top: 20px;
            }
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ===== ARTÍCULO COMPLETO ===== */
        .article-full {
            background: white;
            border-radius: var(--borde-radio);
            padding: 50px;
            box-shadow: var(--sombra-suave);
            border: 1px solid var(--color-borde);
        }

        /* Metadatos */
        .article-meta {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
            color: var(--color-texto-claro);
            font-size: var(--tamano-texto-pequeno);
            flex-wrap: wrap;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--color-borde);
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-meta i {
            color: var(--color-secundario);
        }

        /* Título */
        .article-title {
            font-size: var(--tamano-titulo-articulo);
            color: var(--color-primario);
            margin-bottom: 30px;
            line-height: 1.4;
            font-family: var(--fuente-titulos);
            font-weight: 600;
        }

        /* Contenido */
        .article-content {
            font-size: var(--tamano-texto);
            color: var(--color-texto);
        }

        /* Estilos para el contenido del artículo */
        .article-content h2 {
            font-size: 1.8em;
            color: var(--color-primario);
            margin: 40px 0 20px;
            font-family: var(--fuente-titulos);
        }

        .article-content h3 {
            font-size: 1.4em;
            color: var(--color-primario);
            margin: 30px 0 15px;
        }

        .article-content p {
            margin-bottom: 25px;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 30px 0;
            box-shadow: var(--sombra-suave);
        }

        .article-content blockquote {
            border-left: 4px solid var(--color-secundario);
            padding: 20px 30px;
            background: var(--color-fondo);
            font-style: italic;
            margin: 30px 0;
            border-radius: 0 12px 12px 0;
            color: var(--color-texto-claro);
        }

        .article-content pre {
            background: var(--color-primario);
            color: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
        }

        .article-content ul, .article-content ol {
            margin: 20px 0 20px 30px;
        }

        .article-content li {
            margin-bottom: 10px;
        }

        .article-content a {
            color: var(--color-secundario);
            text-decoration: none;
            border-bottom: 1px dashed var(--color-secundario);
        }

        .article-content a:hover {
            border-bottom-style: solid;
        }

        /* Estilo para diálogos */
        .article-content .dialogo {
            background: var(--color-fondo);
            padding: 20px;
            border-left: 4px solid var(--color-secundario);
            margin: 30px 0;
            border-radius: 0 12px 12px 0;
        }

        .article-content .dialogo p {
            margin-bottom: 10px;
        }

        .article-content .dialogo strong {
            color: var(--color-primario);
        }

        /* Video y audio */
        .article-content video, 
        .article-content audio {
            max-width: 100%;
            margin: 30px 0;
            border-radius: 12px;
        }

        /* ===== ESTADOS ===== */
        .loading, .error-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: var(--borde-radio);
            box-shadow: var(--sombra-suave);
        }

        .loading i {
            font-size: 3em;
            color: var(--color-secundario);
            margin-bottom: 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error-state i {
            font-size: 5em;
            color: var(--color-secundario);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .error-state h2 {
            font-size: 2em;
            color: var(--color-primario);
            margin-bottom: 15px;
        }

        .error-state p {
            color: var(--color-texto-claro);
            max-width: 500px;
            margin: 0 auto;
        }

        .error-state a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: var(--color-primario);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.3s;
        }

        .error-state a:hover {
            background: var(--color-secundario);
        }

        /* ===== FOOTER ===== */
        .site-footer {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto-claro);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .footer-links a {
            color: var(--color-texto-claro);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--color-secundario);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --tamano-titulo-articulo: 2em;
                --tamano-texto: 1.1em;
            }

            .article-full {
                padding: 30px;
            }

            .article-meta {
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .article-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Volver al inicio
        </a>
        <h1>Blog Formal</h1>
    </header>

    <div class="container">
        <div id="articleContainer">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Cargando artículo...</p>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>Blog Formal · Pensamiento y Análisis</p>
        <p style="font-size: 0.9em;">© 2025 · Todos los derechos reservados</p>
        <div class="footer-links">
            <a href="#"><i class="fas fa-rss"></i> RSS</a>
            <a href="#"><i class="fab fa-twitter"></i> Twitter</a>
            <a href="#"><i class="fas fa-envelope"></i> Contacto</a>
        </div>
    </footer>

    <script>
        // ===== MISMA CONFIGURACIÓN QUE EL INDEX =====
        const BLOG_CONFIG = {
            user: 'jalilamado99-spec',        // TU USUARIO DE GITHUB
            repo: 'brusleguas.github.io',     // TU REPOSITORIO
            branch: 'main'                     // RAMA (casi siempre main)
        };

        const BASE_URL = `https://raw.githubusercontent.com/${BLOG_CONFIG.user}/${BLOG_CONFIG.repo}/${BLOG_CONFIG.branch}`;

        // ===== FUNCIÓN PARA CARGAR EL ARTÍCULO =====
        async function cargarArticulo() {
            const articleContainer = document.getElementById('articleContainer');
            
            // Obtener el slug de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            // Si no hay slug, mostrar error
            if (!slug) {
                articleContainer.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Artículo no especificado</h2>
                        <p>No se ha especificado qué artículo deseas ver.</p>
                        <a href="index.html">Volver al inicio</a>
                    </div>
                `;
                return;
            }

            try {
                console.log(`Cargando artículo: ${slug}`);
                
                // Cargar el artículo desde GitHub
                const response = await fetch(`${BASE_URL}/posts/${slug}.json`);

                if (!response.ok) {
                    throw new Error('Artículo no encontrado');
                }

                const articulo = await response.json();
                console.log('Artículo cargado:', articulo);

                // Formatear fecha
                const fecha = new Date(articulo.fecha);
                const fechaFormateada = fecha.toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Calcular tiempo de lectura
                const textoPlano = articulo.contenido
                    .replace(/<[^>]*>/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
                const palabras = textoPlano.split(' ').length;
                const minutosLectura = Math.max(1, Math.ceil(palabras / 200));

                // Construir HTML del artículo
                const html = `
                    <article class="article-full">
                        <h1 class="article-title">${articulo.titulo}</h1>
                        
                        <div class="article-meta">
                            <span>
                                <i class="fas fa-calendar-alt"></i>
                                ${fechaFormateada}
                            </span>
                            <span>
                                <i class="fas fa-user"></i>
                                ${articulo.autor || 'Editorial'}
                            </span>
                            <span>
                                <i class="fas fa-clock"></i>
                                ${minutosLectura} min lectura
                            </span>
                        </div>

                        <div class="article-content">
                            ${articulo.contenido}
                        </div>
                    </article>
                `;

                articleContainer.innerHTML = html;
                
                // Actualizar título de la página
                document.title = `${articulo.titulo} · Blog Formal`;

            } catch (error) {
                console.error('Error cargando artículo:', error);
                
                articleContainer.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Artículo no encontrado</h2>
                        <p>Lo sentimos, el artículo que buscas no existe o ha sido eliminado.</p>
                        <a href="index.html">Volver al inicio</a>
                    </div>
                `;
            }
        }

        // ===== INICIAR CARGA =====
        document.addEventListener('DOMContentLoaded', cargarArticulo);
    </script>
</body>
</html>
