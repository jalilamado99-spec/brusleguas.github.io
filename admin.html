<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Blog Formal</title>
    <!-- Editor Quill -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* (Mantén todos los estilos que ya tenías) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        #loginSection {
            max-width: 450px; margin: 100px auto; background: white;
            padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        #loginSection h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input {
            width: 100%; padding: 15px; border: 2px solid #e0e0e0;
            border-radius: 10px; font-size: 16px;
        }
        
        .login-btn {
            width: 100%; padding: 15px; background: #e74c3c; color: white;
            border: none; border-radius: 10px; font-size: 18px; cursor: pointer;
        }
        
        #mainPanel { display: none; }
        .header {
            background: white; padding: 20px; border-radius: 10px;
            margin-bottom: 20px; display: flex; justify-content: space-between;
        }
        
        .grid-2 {
            display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px;
        }
        
        .card {
            background: white; padding: 25px; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 16px;
        }
        
        #editor { height: 400px; margin-bottom: 20px; }
        
        .btn {
            padding: 15px 30px; border: none; border-radius: 8px;
            font-size: 16px; cursor: pointer; margin-right: 10px;
        }
        .btn-primary { background: #e74c3c; color: white; }
        .btn-secondary { background: #3498db; color: white; }
        
        .message {
            padding: 15px; border-radius: 8px; margin: 20px 0; display: none;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .message.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="loginSection">
            <h2>🔐 Acceso al Panel</h2>
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="usernameInput" value="admin">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="passwordInput">
            </div>
            <button class="login-btn" onclick="verificarCredenciales()">Entrar</button>
            <div id="loginError" style="color: red; margin-top: 10px; display: none;">Error</div>
        </div>
        
        <!-- PANEL PRINCIPAL -->
        <div id="mainPanel">
            <div class="header">
                <h2><i class="fas fa-pen-fancy"></i> Administrar Blog</h2>
                <button onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
            
            <div class="grid-2">
                <!-- Editor -->
                <div class="card">
                    <h3>Crear Artículo</h3>
                    
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="titulo" class="form-control" placeholder="Título del artículo">
                    </div>
                    
                    <div class="form-group">
                        <label>URL (slug)</label>
                        <input type="text" id="slug" class="form-control" placeholder="mi-articulo">
                    </div>
                    
                    <div class="form-group">
                        <label>Contenido</label>
                        <div id="editor"></div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="publicarArticulo()">
                        <i class="fas fa-cloud-upload-alt"></i> Publicar
                    </button>
                    <button class="btn btn-secondary" onclick="previsualizar()">
                        <i class="fas fa-eye"></i> Previsualizar
                    </button>
                </div>
                
                <!-- Multimedia -->
                <div class="card">
                    <h3>Subir Archivos</h3>
                    
                    <input type="file" id="fileInput" accept="image/*,audio/*,video/*" 
                           onchange="prepararSubida()">
                    
                    <button class="btn btn-primary" onclick="subirArchivo()" id="uploadBtn" disabled>
                        Subir Archivo
                    </button>
                    
                    <div id="uploadResult" style="margin-top: 20px;"></div>
                    
                    <button class="btn btn-secondary" style="margin-top: 20px;" onclick="insertarDialogo()">
                        Insertar Diálogo
                    </button>
                </div>
            </div>
            
            <!-- Lista de artículos -->
            <div class="card" style="margin-top: 20px;">
                <h3>Artículos Publicados</h3>
                <div id="articulosList">
                    <p>Cargando...</p>
                </div>
            </div>
            
            <div id="messageBox" class="message"></div>
        </div>
    </div>
    
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <script>
        // ===== CONFIGURACIÓN - EDITA ESTO =====
        const CONFIG = {
            githubToken: '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',  // ← PON TU TOKEN REAL
            githubUser: 'jalilamado99-spec',
            githubRepo: 'brusleguas.github.io',
            branch: 'main',
            usuarios: {
                'admin': 'admin',
                'brusleguas': 'brus0824'
            }
        };

        var quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    ['blockquote'],
                    [{ 'header': 1 }, { 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image']
                ]
            }
        });

        let usuarioActivo = '';
        let archivoSeleccionado = null;

        // ===== LOGIN =====
        function verificarCredenciales() {
            const usuario = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if (CONFIG.usuarios[usuario] && CONFIG.usuarios[usuario] === password) {
                usuarioActivo = usuario;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainPanel').style.display = 'block';
                inicializarPanel();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function cerrarSesion() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mainPanel').style.display = 'none';
        }

        // ===== INICIALIZAR (CREA CARPETAS SI NO EXISTEN) =====
        async function inicializarPanel() {
            mostrarMensaje('Verificando estructura...', 'info');
            
            // Crear carpeta posts si no existe
            await crearCarpetaSiNoExiste('posts');
            await crearCarpetaSiNoExiste('assets');
            
            // Crear archivo lista.json si no existe
            await crearListaSiNoExiste();
            
            cargarListaArticulos();
        }

        async function crearCarpetaSiNoExiste(carpeta) {
            try {
                // Intentar crear un archivo .gitkeep en la carpeta
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${carpeta}/.gitkeep`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Crear carpeta ${carpeta}`,
                        content: btoa('# Carpeta para archivos del blog'),
                        branch: CONFIG.branch
                    })
                });
                
                if (response.ok) {
                    console.log(`Carpeta ${carpeta} creada/verificada`);
                }
            } catch (e) {
                console.log(`Carpeta ${carpeta} ya existe o error:`, e);
            }
        }

        async function crearListaSiNoExiste() {
            try {
                // Verificar si existe lista.json
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/posts/lista.json`, {
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`
                    }
                });
                
                if (!response.ok) {
                    // No existe, crearla
                    await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/posts/lista.json`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${CONFIG.githubToken}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: 'Crear lista de artículos',
                            content: btoa(JSON.stringify([], null, 2)),
                            branch: CONFIG.branch
                        })
                    });
                    console.log('Lista.json creada');
                }
            } catch (e) {
                console.error('Error con lista.json:', e);
            }
        }

        // ===== SUBIR ARCHIVOS (CORREGIDO) =====
        function prepararSubida() {
            const fileInput = document.getElementById('fileInput');
            archivoSeleccionado = fileInput.files[0];
            document.getElementById('uploadBtn').disabled = !archivoSeleccionado;
        }

        async function subirArchivo() {
            if (!archivoSeleccionado) return;
            
            document.getElementById('uploadBtn').disabled = true;
            
            try {
                const reader = new FileReader();
                
                reader.onload = async function(e) {
                    const contenidoBase64 = e.target.result.split(',')[1];
                    const timestamp = Date.now();
                    const nombreLimpio = archivoSeleccionado.name.replace(/[^a-zA-Z0-9.]/g, '_');
                    const ruta = `assets/${timestamp}-${nombreLimpio}`;
                    
                    console.log('Subiendo archivo a:', ruta);
                    
                    const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${ruta}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${CONFIG.githubToken}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Subir: ${archivoSeleccionado.name}`,
                            content: contenidoBase64,
                            branch: CONFIG.branch
                        })
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || 'Error al subir');
                    }
                    
                    const data = await response.json();
                    const urlArchivo = `https://raw.githubusercontent.com/${CONFIG.githubUser}/${CONFIG.githubRepo}/main/${ruta}`;
                    
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="background: #d4edda; padding: 15px; border-radius: 8px;">
                            <strong>✅ Archivo subido!</strong><br>
                            <input type="text" value="${urlArchivo}" style="width: 100%; padding: 8px; margin: 10px 0;" readonly>
                            <button onclick="insertarEnEditor('${urlArchivo}')" style="padding: 8px 15px;">
                                Insertar en artículo
                            </button>
                        </div>
                    `;
                    
                    // Reset
                    document.getElementById('fileInput').value = '';
                    archivoSeleccionado = null;
                };
                
                reader.readAsDataURL(archivoSeleccionado);
                
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al subir: ' + error.message, 'error');
            } finally {
                document.getElementById('uploadBtn').disabled = false;
            }
        }

        function insertarEnEditor(url) {
            const extension = url.split('.').pop().toLowerCase();
            const imagenes = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
            
            let html = '';
            
            if (imagenes.includes(extension)) {
                html = `<img src="${url}" alt="Imagen" style="max-width: 100%;">`;
            } else {
                html = `<a href="${url}" target="_blank">🔗 Ver archivo</a>`;
            }
            
            const range = quill.getSelection();
            quill.clipboard.dangerouslyPasteHTML(range ? range.index : 0, html);
            document.getElementById('uploadResult').innerHTML = '';
        }

        // ===== PUBLICAR ARTÍCULO (CORREGIDO) =====
        async function publicarArticulo() {
            const titulo = document.getElementById('titulo').value.trim();
            const slug = document.getElementById('slug').value.trim();
            const contenido = quill.root.innerHTML;
            
            if (!titulo || !slug || !contenido) {
                mostrarMensaje('Completa todos los campos', 'error');
                return;
            }
            
            mostrarMensaje('Publicando artículo...', 'info');
            
            try {
                const articulo = {
                    titulo: titulo,
                    fecha: new Date().toISOString(),
                    contenido: contenido,
                    autor: 'brusleguas'  // ← SIEMPRE brusleguas
                };
                
                const rutaJSON = `posts/${slug}.json`;
                const contenidoJSON = JSON.stringify(articulo, null, 2);
                
                // Verificar si ya existe
                let sha = null;
                try {
                    const getResponse = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${rutaJSON}`, {
                        headers: {
                            'Authorization': `token ${CONFIG.githubToken}`
                        }
                    });
                    if (getResponse.ok) {
                        const data = await getResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {}
                
                // Subir artículo
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${rutaJSON}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Publicar: ${titulo}`,
                        content: btoa(unescape(encodeURIComponent(contenidoJSON))),
                        branch: CONFIG.branch,
                        sha: sha
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Error al publicar');
                }
                
                // Actualizar lista
                await actualizarLista(slug, titulo);
                
                mostrarMensaje('✅ Artículo publicado con éxito', 'success');
                
                // Limpiar
                document.getElementById('titulo').value = '';
                document.getElementById('slug').value = '';
                quill.setContents([]);
                
                // Recargar lista
                cargarListaArticulos();
                
            } catch (error) {
                console.error('Error publicando:', error);
                mostrarMensaje('Error: ' + error.message, 'error');
            }
        }

        async function actualizarLista(slug, titulo) {
            const listaPath = 'posts/lista.json';
            let lista = [];
            let sha = null;
            
            try {
                // Obtener lista actual
                const getResponse = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${listaPath}`, {
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`
                    }
                });
                
                if (getResponse.ok) {
                    const data = await getResponse.json();
                    sha = data.sha;
                    const contenido = atob(data.content);
                    lista = JSON.parse(contenido);
                }
            } catch (e) {
                console.log('Lista no existe, se creará nueva');
            }
            
            // Añadir o actualizar
            const index = lista.findIndex(a => a.slug === slug);
            const nuevoArticulo = {
                slug: slug,
                titulo: titulo,
                fecha: new Date().toISOString(),
                autor: 'brusleguas'
            };
            
            if (index >= 0) {
                lista[index] = nuevoArticulo;
            } else {
                lista.push(nuevoArticulo);
            }
            
            // Guardar lista
            await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${listaPath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${CONFIG.githubToken}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: 'Actualizar lista de artículos',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(lista, null, 2)))),
                    branch: CONFIG.branch,
                    sha: sha
                })
            });
        }

        // ===== CARGAR LISTA DE ARTÍCULOS =====
        async function cargarListaArticulos() {
            const listaDiv = document.getElementById('articulosList');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/posts/lista.json`, {
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`
                    }
                });
                
                if (!response.ok) {
                    listaDiv.innerHTML = '<p>No hay artículos</p>';
                    return;
                }
                
                const data = await response.json();
                const contenido = atob(data.content);
                const articulos = JSON.parse(contenido);
                
                if (articulos.length === 0) {
                    listaDiv.innerHTML = '<p>No hay artículos publicados</p>';
                    return;
                }
                
                articulos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                
                let html = '<ul>';
                articulos.forEach(art => {
                    const fecha = new Date(art.fecha).toLocaleDateString();
                    html += `
                        <li style="margin-bottom: 10px; padding: 10px; background: #f8f9fa;">
                            <strong>${art.titulo}</strong><br>
                            <small>${fecha} - ${art.autor || 'brusleguas'}</small>
                        </li>
                    `;
                });
                html += '</ul>';
                
                listaDiv.innerHTML = html;
                
            } catch (error) {
                listaDiv.innerHTML = '<p>Error al cargar</p>';
            }
        }

        function insertarDialogo() {
            const dialogHTML = `
                <div style="background: #f0f0f0; padding: 15px; border-left: 4px solid #e74c3c; margin: 15px 0;">
                    <p><strong>Personaje:</strong> Texto del diálogo</p>
                </div>
            `;
            const range = quill.getSelection();
            quill.clipboard.dangerouslyPasteHTML(range ? range.index : 0, dialogHTML);
        }

        function previsualizar() {
            const titulo = document.getElementById('titulo').value;
            const contenido = quill.root.innerHTML;
            if (!titulo || !contenido) return;
            
            const preview = window.open('', '_blank');
            preview.document.write(`
                <html><head><title>${titulo}</title></head>
                <body style="max-width:800px; margin:40px auto; padding:20px;">
                    <h1>${titulo}</h1>
                    ${contenido}
                </body></html>
            `);
        }

        function mostrarMensaje(texto, tipo) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = texto;
            msgBox.className = `message ${tipo}`;
            setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
