<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Mi Blog</title>
    <!-- Editor Quill -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== ESTILOS SIMPLES Y CLAROS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== PANTALLA DE LOGIN ===== */
        #loginSection {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        #loginSection h2 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 28px;
        }

        #loginSection input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
        }

        #loginSection button {
            width: 100%;
            padding: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginSection button:hover {
            background: #c0392b;
        }

        #loginError {
            color: #e74c3c;
            margin-top: 15px;
            display: none;
        }

        /* ===== PANEL PRINCIPAL ===== */
        #mainPanel {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* Cabecera */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #e74c3c;
        }

        .header h2 {
            color: #2c3e50;
            font-size: 28px;
        }

        .header button {
            padding: 12px 25px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        /* ===== BOTONES GRANDES ===== */
        .botones-accion {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-accion {
            padding: 30px 15px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e0e0e0;
        }

        .btn-accion i {
            font-size: 48px;
        }

        .btn-accion:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .btn-accion.dialogo:hover {
            background: #e8f4fd;
            border-color: #3498db;
        }

        .btn-accion.audio:hover {
            background: #fde9e9;
            border-color: #e74c3c;
        }

        .btn-accion.video:hover {
            background: #e8f8f0;
            border-color: #27ae60;
        }

        .btn-accion.imagen:hover {
            background: #fef5e7;
            border-color: #f39c12;
        }

        /* ===== FORMULARIO ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
        }

        /* Editor */
        #editor {
            height: 300px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        /* ===== BOTONES PRINCIPALES ===== */
        .btn-publicar {
            padding: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
        }

        .btn-publicar:hover {
            background: #c0392b;
        }

        .btn-previsualizar {
            padding: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }

        /* ===== SUBIDA DE ARCHIVOS ===== */
        .upload-area {
            background: #f8f9fa;
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        #fileInput {
            display: none;
        }

        .upload-label {
            display: inline-block;
            padding: 20px 40px;
            background: #3498db;
            color: white;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            margin: 10px 0;
        }

        .upload-label i {
            margin-right: 10px;
        }

        #fileName {
            font-size: 16px;
            color: #666;
            margin: 10px 0;
        }

        #uploadBtn {
            padding: 15px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        #uploadBtn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        /* URL result */
        .url-box {
            background: #d4edda;
            border: 2px solid #27ae60;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .url-box input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #27ae60;
            border-radius: 5px;
            font-size: 16px;
        }

        .url-box button {
            padding: 15px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        /* ===== LISTA DE ARTÍCULOS ===== */
        .articulos-lista {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .articulos-lista h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .articulo-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 5px solid #e74c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .articulo-item button {
            padding: 8px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-ver {
            background: #3498db;
            color: white;
        }

        .btn-editar {
            background: #f39c12;
            color: white;
        }

        /* Mensajes */
        #messageBox {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
            font-size: 18px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #27ae60;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #e74c3c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .botones-accion {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="loginSection">
            <h2><i class="fas fa-lock"></i> Acceso al Panel</h2>
            <input type="text" id="usernameInput" placeholder="Usuario" value="admin">
            <input type="password" id="passwordInput" placeholder="Contraseña">
            <button onclick="verificarCredenciales()">ENTRAR</button>
            <div id="loginError">Usuario o contraseña incorrectos</div>
        </div>
        
        <!-- PANEL PRINCIPAL -->
        <div id="mainPanel">
            <div class="header">
                <h2><i class="fas fa-pen-fancy"></i> Administrar Blog</h2>
                <button onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
            
            <!-- BOTONES DE ACCIÓN RÁPIDA -->
            <div class="botones-accion">
                <button class="btn-accion dialogo" onclick="insertarDialogo()">
                    <i class="fas fa-comment-dots"></i>
                    <span>DIÁLOGO</span>
                </button>
                <button class="btn-accion audio" onclick="seleccionarTipoArchivo('audio')">
                    <i class="fas fa-microphone-alt"></i>
                    <span>AUDIO</span>
                </button>
                <button class="btn-accion video" onclick="seleccionarTipoArchivo('video')">
                    <i class="fas fa-video"></i>
                    <span>VIDEO</span>
                </button>
                <button class="btn-accion imagen" onclick="seleccionarTipoArchivo('imagen')">
                    <i class="fas fa-image"></i>
                    <span>IMAGEN</span>
                </button>
            </div>
            
            <!-- FORMULARIO -->
            <div class="form-group">
                <label>TÍTULO DEL ARTÍCULO</label>
                <input type="text" id="titulo" placeholder="Escribe el título aquí">
            </div>
            
            <div class="form-group">
                <label>URL DEL ARTÍCULO (slug)</label>
                <input type="text" id="slug" placeholder="mi-articulo">
            </div>
            
            <div class="form-group">
                <label>CONTENIDO</label>
                <div id="editor"></div>
            </div>
            
            <!-- SUBIR ARCHIVO (se muestra cuando se necesita) -->
            <div id="uploadSection" style="display: none;">
                <div class="upload-area">
                    <input type="file" id="fileInput" onchange="prepararSubida()">
                    <label for="fileInput" class="upload-label">
                        <i class="fas fa-folder-open"></i> SELECCIONAR ARCHIVO
                    </label>
                    <div id="fileName">Ningún archivo seleccionado</div>
                    <button id="uploadBtn" onclick="subirArchivo()" disabled>
                        <i class="fas fa-upload"></i> SUBIR ARCHIVO
                    </button>
                </div>
                <div id="uploadResult"></div>
            </div>
            
            <!-- BOTONES PRINCIPALES -->
            <button class="btn-publicar" onclick="publicarArticulo()">
                <i class="fas fa-cloud-upload-alt"></i> PUBLICAR ARTÍCULO
            </button>
            
            <button class="btn-previsualizar" onclick="previsualizar()">
                <i class="fas fa-eye"></i> PREVISUALIZAR
            </button>
            
            <!-- LISTA DE ARTÍCULOS -->
            <div class="articulos-lista">
                <h3><i class="fas fa-book-open"></i> Artículos Publicados</h3>
                <div id="articulosList">
                    <p style="text-align: center; color: #666;">Cargando artículos...</p>
                </div>
            </div>
            
            <!-- MENSAJES -->
            <div id="messageBox"></div>
        </div>
    </div>
    
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <script>
        // ===== CONFIGURACIÓN =====
        const CONFIG = {
            githubToken: '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',  // ← PON TU TOKEN
            githubUser: 'jalilamado99-spec',
            githubRepo: 'brusleguas.github.io',
            branch: 'main',
            usuarios: {
                'admin': 'blog2024',
                'brusleguas': '123456'
            }
        };

        // Inicializar editor
        var quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    ['blockquote'],
                    [{ 'header': 1 }, { 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }]
                ]
            },
            placeholder: 'Escribe aquí el contenido...'
        });

        let usuarioActivo = '';
        let archivoSeleccionado = null;
        let tipoArchivoActual = '';

        // ===== LOGIN =====
        function verificarCredenciales() {
            const usuario = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if (CONFIG.usuarios[usuario] && CONFIG.usuarios[usuario] === password) {
                usuarioActivo = usuario;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainPanel').style.display = 'block';
                inicializar();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function cerrarSesion() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mainPanel').style.display = 'none';
        }

        // ===== INICIALIZAR =====
        async function inicializar() {
            mostrarMensaje('Conectando...', 'info');
            await crearEstructura();
            cargarListaArticulos();
        }

        async function crearEstructura() {
            const carpetas = ['posts', 'assets'];
            for (const carpeta of carpetas) {
                try {
                    await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${carpeta}/.gitkeep`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${CONFIG.githubToken}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Crear carpeta ${carpeta}`,
                            content: btoa('# Carpeta'),
                            branch: CONFIG.branch
                        })
                    });
                } catch (e) {}
            }
        }

        // ===== BOTONES DE ACCIÓN =====
        function seleccionarTipoArchivo(tipo) {
            tipoArchivoActual = tipo;
            
            let accept = '';
            if (tipo === 'audio') accept = 'audio/*';
            else if (tipo === 'video') accept = 'video/*';
            else if (tipo === 'imagen') accept = 'image/*';
            
            document.getElementById('fileInput').accept = accept;
            document.getElementById('uploadSection').style.display = 'block';
            
            // Hacer scroll a la sección de subida
            document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth' });
        }

        function insertarDialogo() {
            const dialogHTML = `
                <div style="background: #f0f0f0; padding: 15px; border-left: 4px solid #3498db; margin: 15px 0;">
                    <p><strong style="color: #3498db;">🎤 Personaje:</strong> Texto del diálogo</p>
                </div>
            `;
            const range = quill.getSelection();
            quill.clipboard.dangerouslyPasteHTML(range ? range.index : 0, dialogHTML);
            mostrarMensaje('✅ Diálogo insertado', 'success');
        }

        // ===== SUBIR ARCHIVO =====
        function prepararSubida() {
            const fileInput = document.getElementById('fileInput');
            archivoSeleccionado = fileInput.files[0];
            
            if (archivoSeleccionado) {
                document.getElementById('fileName').textContent = 
                    `📄 ${archivoSeleccionado.name}`;
                document.getElementById('uploadBtn').disabled = false;
            }
        }

        async function subirArchivo() {
            if (!archivoSeleccionado) return;
            
            document.getElementById('uploadBtn').disabled = true;
            
            try {
                const reader = new FileReader();
                
                reader.onload = async function(e) {
                    const contenidoBase64 = e.target.result.split(',')[1];
                    const timestamp = Date.now();
                    const nombreLimpio = archivoSeleccionado.name.replace(/[^a-zA-Z0-9.]/g, '_');
                    const ruta = `assets/${timestamp}-${nombreLimpio}`;
                    
                    const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${ruta}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${CONFIG.githubToken}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Subir: ${archivoSeleccionado.name}`,
                            content: contenidoBase64,
                            branch: CONFIG.branch
                        })
                    });
                    
                    if (!response.ok) throw new Error('Error al subir');
                    
                    const urlArchivo = `https://raw.githubusercontent.com/${CONFIG.githubUser}/${CONFIG.githubRepo}/main/${ruta}`;
                    
                    document.getElementById('uploadResult').innerHTML = `
                        <div class="url-box">
                            <strong>✅ ARCHIVO SUBIDO</strong>
                            <input type="text" value="${urlArchivo}" readonly>
                            <button onclick="insertarEnEditor('${urlArchivo}')">
                                INSERTAR EN ARTÍCULO
                            </button>
                        </div>
                    `;
                    
                    // Reset
                    document.getElementById('fileInput').value = '';
                    document.getElementById('fileName').textContent = 'Ningún archivo seleccionado';
                    archivoSeleccionado = null;
                    
                    mostrarMensaje('✅ Archivo subido con éxito', 'success');
                };
                
                reader.readAsDataURL(archivoSeleccionado);
                
            } catch (error) {
                mostrarMensaje('❌ Error: ' + error.message, 'error');
            }
        }

        function insertarEnEditor(url) {
            const extension = url.split('.').pop().toLowerCase();
            const imagenes = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
            const videos = ['mp4', 'webm'];
            const audios = ['mp3', 'wav'];
            
            let html = '';
            
            if (imagenes.includes(extension)) {
                html = `<img src="${url}" alt="Imagen" style="max-width:100%; margin:10px 0;">`;
            } else if (videos.includes(extension)) {
                html = `<video controls style="max-width:100%; margin:10px 0;"><source src="${url}"></video>`;
            } else if (audios.includes(extension)) {
                html = `<audio controls style="margin:10px 0;"><source src="${url}"></audio>`;
            } else {
                html = `<a href="${url}" target="_blank">📎 Ver archivo</a>`;
            }
            
            const range = quill.getSelection();
            quill.clipboard.dangerouslyPasteHTML(range ? range.index : 0, html);
            document.getElementById('uploadResult').innerHTML = '';
            document.getElementById('uploadSection').style.display = 'none';
            mostrarMensaje('✅ Archivo insertado', 'success');
        }

        // ===== PUBLICAR ARTÍCULO =====
        async function publicarArticulo() {
            const titulo = document.getElementById('titulo').value.trim();
            const slug = document.getElementById('slug').value.trim();
            const contenido = quill.root.innerHTML;
            
            if (!titulo || !slug || !contenido) {
                mostrarMensaje('❌ Completa todos los campos', 'error');
                return;
            }
            
            mostrarMensaje('Publicando...', 'info');
            
            try {
                const articulo = {
                    titulo: titulo,
                    fecha: new Date().toISOString(),
                    contenido: contenido,
                    autor: 'brusleguas'
                };
                
                const rutaJSON = `posts/${slug}.json`;
                const contenidoJSON = JSON.stringify(articulo, null, 2);
                
                // Verificar si existe
                let sha = null;
                try {
                    const getResponse = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${rutaJSON}`, {
                        headers: {
                            'Authorization': `token ${CONFIG.githubToken}`
                        }
                    });
                    if (getResponse.ok) {
                        const data = await getResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {}
                
                // Subir
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${rutaJSON}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Publicar: ${titulo}`,
                        content: btoa(unescape(encodeURIComponent(contenidoJSON))),
                        branch: CONFIG.branch,
                        sha: sha
                    })
                });
                
                if (!response.ok) throw new Error('Error al publicar');
                
                await actualizarLista(slug, titulo);
                
                mostrarMensaje('✅ Artículo publicado con éxito', 'success');
                
                // Limpiar
                document.getElementById('titulo').value = '';
                document.getElementById('slug').value = '';
                quill.setContents([]);
                
                cargarListaArticulos();
                
            } catch (error) {
                mostrarMensaje('❌ Error: ' + error.message, 'error');
            }
        }

        async function actualizarLista(slug, titulo) {
            const listaPath = 'posts/lista.json';
            let lista = [];
            let sha = null;
            
            try {
                const getResponse = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${listaPath}`, {
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`
                    }
                });
                
                if (getResponse.ok) {
                    const data = await getResponse.json();
                    sha = data.sha;
                    const contenido = atob(data.content);
                    lista = JSON.parse(contenido);
                }
            } catch (e) {}
            
            const index = lista.findIndex(a => a.slug === slug);
            const nuevoArticulo = {
                slug: slug,
                titulo: titulo,
                fecha: new Date().toISOString(),
                autor: 'brusleguas'
            };
            
            if (index >= 0) {
                lista[index] = nuevoArticulo;
            } else {
                lista.push(nuevoArticulo);
            }
            
            await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${listaPath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${CONFIG.githubToken}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: 'Actualizar lista',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(lista, null, 2)))),
                    branch: CONFIG.branch,
                    sha: sha
                })
            });
        }

        // ===== CARGAR ARTÍCULOS =====
        async function cargarListaArticulos() {
            const listaDiv = document.getElementById('articulosList');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/posts/lista.json`, {
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`
                    }
                });
                
                if (!response.ok) {
                    listaDiv.innerHTML = '<p style="text-align:center;">No hay artículos</p>';
                    return;
                }
                
                const data = await response.json();
                const contenido = atob(data.content);
                const articulos = JSON.parse(contenido);
                
                if (articulos.length === 0) {
                    listaDiv.innerHTML = '<p style="text-align:center;">No hay artículos publicados</p>';
                    return;
                }
                
                articulos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                
                let html = '';
                articulos.forEach(art => {
                    const fecha = new Date(art.fecha).toLocaleDateString();
                    html += `
                        <div class="articulo-item">
                            <div>
                                <strong>${art.titulo}</strong><br>
                                <small>${fecha}</small>
                            </div>
                            <div>
                                <button class="btn-ver" onclick="verArticulo('${art.slug}')">👁️ Ver</button>
                                <button class="btn-editar" onclick="editarArticulo('${art.slug}')">✏️ Editar</button>
                            </div>
                        </div>
                    `;
                });
                
                listaDiv.innerHTML = html;
                
            } catch (error) {
                listaDiv.innerHTML = '<p style="text-align:center;color:red;">Error al cargar</p>';
            }
        }

        function verArticulo(slug) {
            window.open(`post.html?slug=${slug}`, '_blank');
        }

        async function editarArticulo(slug) {
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/posts/${slug}.json`, {
                    headers: {
                        'Authorization': `token ${CONFIG.githubToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const contenido = atob(data.content);
                    const articulo = JSON.parse(contenido);
                    
                    document.getElementById('titulo').value = articulo.titulo;
                    document.getElementById('slug').value = slug;
                    quill.root.innerHTML = articulo.contenido;
                    
                    mostrarMensaje('Artículo cargado', 'success');
                }
            } catch (error) {
                mostrarMensaje('Error al cargar', 'error');
            }
        }

        // ===== PREVISUALIZAR =====
        function previsualizar() {
            const titulo = document.getElementById('titulo').value;
            const contenido = quill.root.innerHTML;
            
            if (!titulo || !contenido) {
                mostrarMensaje('Completa título y contenido', 'error');
                return;
            }
            
            const preview = window.open('', '_blank');
            preview.document.write(`
                <html>
                <head>
                    <title>${titulo}</title>
                    <style>
                        body { max-width:800px; margin:40px auto; padding:20px; font-family:Georgia; }
                        h1 { color:#2c3e50; }
                    </style>
                </head>
                <body>
                    <h1>${titulo}</h1>
                    ${contenido}
                </body>
                </html>
            `);
        }

        // ===== MENSAJES =====
        function mostrarMensaje(texto, tipo) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = texto;
            msgBox.className = tipo;
            msgBox.style.display = 'block';
            
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
