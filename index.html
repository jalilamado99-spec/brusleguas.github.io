<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    <style>
        :root {
            --color-primario: #2c3e50;
            --color-secundario: #e74c3c;
            --color-fondo: #fafafa;
            --fuente-titulo: 48px;
            --fuente-normal: 18px;
        }
        
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            background: var(--color-fondo);
            color: #333;
        }
        
        header {
            background: var(--color-primario);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        
        header h1 {
            font-size: var(--fuente-titulo);
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .articulo {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .articulo h2 {
            margin: 0 0 10px 0;
        }
        
        .articulo h2 a {
            color: var(--color-primario);
            text-decoration: none;
            font-size: 28px;
        }
        
        .articulo .fecha {
            color: #7f8c8d;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .admin-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--color-secundario);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <header>
        <h1>Mi Blog</h1>
    </header>
    
    <div class="container" id="blog-content">
        <p style="text-align: center;">Cargando artículos...</p>
    </div>
    
    <a href="admin.html" class="admin-link">⚙️ Administrar</a>
    
    <script>
        const BLOG_CONFIG = {
            user: 'brusleguas',
            repo: 'mi-blog'
        };
        
        async function cargarBlog() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${BLOG_CONFIG.user}/${BLOG_CONFIG.repo}/main/posts/lista.json`);
                
                if (!response.ok) {
                    document.getElementById('blog-content').innerHTML = `
                        <p style="text-align: center;">No hay artículos aún</p>
                    `;
                    return;
                }
                
                const articulos = await response.json();
                articulos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                
                let html = '';
                
                for (let art of articulos) {
                    const fecha = new Date(art.fecha).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    html += `
                        <div class="articulo">
                            <h2><a href="post.html?slug=${art.slug}">${art.titulo}</a></h2>
                            <div class="fecha">📅 ${fecha}</div>
                            <a href="post.html?slug=${art.slug}" style="color: var(--color-secundario);">Leer más →</a>
                        </div>
                    `;
                }
                
                document.getElementById('blog-content').innerHTML = html;
                
            } catch (error) {
                document.getElementById('blog-content').innerHTML = `
                    <p style="text-align: center; color: #e74c3c;">Error al cargar el blog</p>
                `;
            }
        }
        
        cargarBlog();
    </script>
</body>
</html>
