<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brus leguas</title>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== ESTILOS FORMALES Y ELEGANTES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #f5f7fa;
            color: #2c4058;
            line-height: 1.8;
        }

        /* Encabezado elegante con gradiente */
        .site-header {
            background: linear-gradient(135deg, #1e3c4f 0%, #2c5a7a 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
            position: relative;
            border-bottom: 5px solid #d98c3b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .site-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08"><path d="M20 20 L80 20 L80 80 L20 80 Z" fill="none" stroke="white" stroke-width="1.5"/><path d="M30 30 L70 30 L70 70 L30 70 Z" fill="none" stroke="white" stroke-width="1.5"/><path d="M40 40 L60 40 L60 60 L40 60 Z" fill="none" stroke="white" stroke-width="1.5"/></svg>') repeat;
            pointer-events: none;
        }

        .site-header h1 {
            font-size: 4em;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-family: 'Playfair Display', Georgia, serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
        }

        .site-header p {
            font-size: 1.3em;
            opacity: 0.9;
            font-style: italic;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        /* Contenedor principal */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Barra de herramientas */
        .toolbar {
            background: white;
            border-radius: 50px;
            padding: 15px 30px;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #e9ecef;
        }

        .blog-title {
            font-size: 1.2em;
            color: #2c4058;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .blog-title i {
            color: #d98c3b;
            margin-right: 10px;
        }

        .admin-link {
            background: linear-gradient(135deg, #1e3c4f 0%, #2c5a7a 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .admin-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #234b61 0%, #316d93 100%);
        }

        .admin-link i {
            font-size: 1.1em;
        }

        /* Lista de artículos */
        .articles {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Tarjeta de artículo */
        .article-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.3s;
            border: 1px solid #e9ecef;
            position: relative;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-color: #d98c3b;
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #1e3c4f 0%, #2c5a7a 100%);
            border-radius: 20px 0 0 20px;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            color: #6c7a89;
            font-size: 0.95em;
            flex-wrap: wrap;
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-meta i {
            color: #d98c3b;
        }

        .article-title {
            font-size: 2em;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .article-title a {
            color: #1e3c4f;
            text-decoration: none;
            transition: color 0.3s;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .article-title a:hover {
            color: #d98c3b;
        }

        .article-excerpt {
            color: #4a5a6a;
            margin-bottom: 25px;
            font-size: 1.1em;
            line-height: 1.8;
            padding-right: 20px;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #d98c3b;
            text-decoration: none;
            font-weight: 500;
            transition: gap 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
            border-bottom: 2px solid transparent;
            padding-bottom: 3px;
        }

        .read-more:hover {
            gap: 15px;
            border-bottom-color: #d98c3b;
        }

        /* Estado vacío */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }

        .empty-state i {
            font-size: 5em;
            color: #d98c3b;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 2em;
            color: #1e3c4f;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .empty-state p {
            color: #6c7a89;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Pie de página */
        .site-footer {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
            color: #6c7a89;
        }

        .site-footer p {
            margin-bottom: 10px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .footer-links a {
            color: #6c7a89;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.95em;
        }

        .footer-links a:hover {
            color: #d98c3b;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading i {
            font-size: 3em;
            color: #d98c3b;
            margin-bottom: 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .site-header h1 {
                font-size: 2.5em;
            }

            .site-header p {
                font-size: 1.1em;
            }

            .article-title {
                font-size: 1.5em;
            }

            .toolbar {
                flex-direction: column;
                text-align: center;
                border-radius: 20px;
            }

            .article-card {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            .article-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
    <!-- Fuente Playfair Display para títulos -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <h1>Brus leguas</h1>
        <p></p>
    </header>

    <div class="container">
        <!-- Barra de herramientas -->
        <div class="toolbar">
            <div class="blog-title">
                <i class="fas fa-pen-fancy"></i> 
                Publicaciones recientes
            </div>
            <a href="admin.html" class="admin-link">
                <i class="fas fa-lock"></i>
                Panel de Administración
            </a>
        </div>

        <!-- Lista de artículos -->
        <div id="articlesList" class="articles">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Cargando publicaciones...</p>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>Brus leguas</p>
        <p style="font-size: 0.9em;">© 2025 · Todos los derechos reservados</p>
        <div class="footer-links">
            <a href="#"><i class="fas fa-rss"></i> RSS</a>
            <a href="#"><i class="fab fa-twitter"></i> Twitter</a>
            <a href="#"><i class="fas fa-envelope"></i> Contacto</a>
        </div>
    </footer>

    <script>
        // ===== CONFIGURACIÓN DE GITHUB =====
        // ADAPTADO PARA TU REPOSITORIO
        const GITHUB_CONFIG = {
            user: 'jalilamado99-spec',
            repo: 'brusleguas.github.io',
            branch: 'main'
        };

        // URL base para archivos raw
        const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}`;

        // ===== CARGAR ARTÍCULOS DESDE GITHUB =====
        async function cargarArticulos() {
            const articlesList = document.getElementById('articlesList');
            
            try {
                // Intentar cargar la lista de artículos
                const response = await fetch(`${RAW_BASE}/posts/lista.json`);
                
                if (!response.ok) {
                    // Si no hay lista, mostrar mensaje de bienvenida
                    articlesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-feather-alt"></i>
                            <h2>Bienvenido al Blog Formal</h2>
                            <p>Este espacio está en construcción. Pronto encontrarás artículos sobre pensamiento crítico, análisis y reflexiones.</p>
                            <p style="margin-top: 20px; font-size: 0.95em;">
                                <i class="fas fa-lock" style="color: #d98c3b;"></i> 
                                Accede al panel de administración para comenzar a publicar.
                            </p>
                        </div>
                    `;
                    return;
                }

                const articulos = await response.json();
                
                if (!articulos || articulos.length === 0) {
                    articlesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-book-open"></i>
                            <h2>No hay publicaciones aún</h2>
                            <p>Próximamente encontrarás contenido interesante aquí.</p>
                        </div>
                    `;
                    return;
                }

                // Ordenar por fecha (más reciente primero)
                articulos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                let html = '';
                
                // Cargar cada artículo individualmente para obtener el resumen
                for (let i = 0; i < articulos.length; i++) {
                    const art = articulos[i];
                    
                    try {
                        // Cargar el artículo completo para obtener el contenido
                        const artResponse = await fetch(`${RAW_BASE}/posts/${art.slug}.json`);
                        
                        if (artResponse.ok) {
                            const articuloCompleto = await artResponse.json();
                            
                            // Crear resumen (primeros 300 caracteres sin HTML)
                            const textoPlano = articuloCompleto.contenido
                                .replace(/<[^>]*>/g, ' ')  // Quitar HTML
                                .replace(/\s+/g, ' ')       // Normalizar espacios
                                .trim();
                            
                            const resumen = textoPlano.substring(0, 250) + '...';
                            
                            // Formatear fecha
                            const fecha = new Date(art.fecha);
                            const fechaFormateada = fecha.toLocaleDateString('es-ES', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });

                            html += `
                                <article class="article-card">
                                    <div class="article-meta">
                                        <span>
                                            <i class="fas fa-calendar-alt"></i>
                                            ${fechaFormateada}
                                        </span>
                                        <span>
                                            <i class="fas fa-user"></i>
                                            ${articuloCompleto.autor || 'Editorial'}
                                        </span>
                                        <span>
                                            <i class="fas fa-clock"></i>
                                            ${Math.ceil(textoPlano.length / 1000)} min lectura
                                        </span>
                                    </div>
                                    <h2 class="article-title">
                                        <a href="post.html?slug=${art.slug}">
                                            ${articuloCompleto.titulo}
                                        </a>
                                    </h2>
                                    <div class="article-excerpt">
                                        ${resumen}
                                    </div>
                                    <a href="post.html?slug=${art.slug}" class="read-more">
                                        SEGUIR LEYENDO 
                                        <i class="fas fa-arrow-right"></i>
                                    </a>
                                </article>
                            `;
                        }
                    } catch (e) {
                        console.warn(`Error cargando artículo ${art.slug}:`, e);
                    }
                }

                if (html) {
                    articlesList.innerHTML = html;
                } else {
                    articlesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h2>Error al cargar</h2>
                            <p>No se pudieron cargar los artículos. Intenta más tarde.</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error cargando artículos:', error);
                articlesList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: #d98c3b;"></i>
                        <h2>Error de conexión</h2>
                        <p>No se pudo conectar con GitHub. Verifica tu conexión a internet.</p>
                        <p style="margin-top: 15px; font-size: 0.9em; color: #6c7a89;">
                            <i class="fas fa-code-branch"></i> 
                            Repositorio: ${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}
                        </p>
                    </div>
                `;
            }
        }

        // Cargar artículos al iniciar
        document.addEventListener('DOMContentLoaded', cargarArticulos);
    </script>
</body>
</html>
