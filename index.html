<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brus leguas</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ===== VARIABLES GLOBALES - CAMBIA AQUÍ LOS COLORES ===== */
        :root {
            /* COLORES PRINCIPALES - Cámbialos a tu gusto */
            --color-primario: #1e3c4f;        /* Azul oscuro principal */
            --color-secundario: #d98c3b;       /* Naranja/accento */
            --color-fondo: #f8fafc;            /* Fondo general */
            --color-texto: #2c4058;             /* Color de texto principal */
            --color-texto-claro: #5a6f7d;       /* Texto secundario */
            --color-borde: #e9ecef;              /* Color de bordes */
            
            /* TIPOGRAFÍA */
            --fuente-titulos: 'Playfair Display', Georgia, serif;
            --fuente-texto: 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
            
            /* TAMAÑOS */
            --tamano-titulo-site: 4em;
            --tamano-titulo-articulo: 2.2em;
            --tamano-texto: 1.1em;
            
            /* ESPACIADO */
            --espaciado-general: 20px;
            --borde-radio: 20px;
            
            /* SOMBRAS */
            --sombra-suave: 0 10px 30px rgba(0,0,0,0.05);
            --sombra-fuerte: 0 20px 40px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fuente-texto);
            background: var(--color-fondo);
            color: var(--color-texto);
            line-height: 1.8;
        }

        /* ===== HEADER ===== */
        .site-header {
            background: linear-gradient(135deg, var(--color-primario) 0%, #2c5a7a 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
            position: relative;
            border-bottom: 5px solid var(--color-secundario);
            box-shadow: var(--sombra-fuerte);
        }

        .site-header h1 {
            font-size: var(--tamano-titulo-site);
            font-weight: 500;
            margin-bottom: 15px;
            font-family: var(--fuente-titulos);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .site-header p {
            font-size: 1.3em;
            opacity: 0.9;
            font-style: italic;
            max-width: 700px;
            margin: 0 auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ===== BARRA DE HERRAMIENTAS ===== */
        .toolbar {
            background: white;
            border-radius: 50px;
            padding: 15px 30px;
            margin-bottom: 40px;
            box-shadow: var(--sombra-suave);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid var(--color-borde);
        }

        .blog-title {
            font-size: 1.2em;
            color: var(--color-texto);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .blog-title i {
            color: var(--color-secundario);
            margin-right: 10px;
        }

        .admin-link {
            background: linear-gradient(135deg, var(--color-primario) 0%, #2c5a7a 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .admin-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: var(--color-secundario);
        }

        /* ===== LISTA DE ARTÍCULOS ===== */
        .articles {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Tarjeta de artículo */
        .article-card {
            background: white;
            border-radius: var(--borde-radio);
            padding: 35px;
            box-shadow: var(--sombra-suave);
            transition: all 0.3s;
            border: 1px solid var(--color-borde);
            position: relative;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--sombra-fuerte);
            border-color: var(--color-secundario);
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, var(--color-primario) 0%, var(--color-secundario) 100%);
            border-radius: var(--borde-radio) 0 0 var(--borde-radio);
        }

        /* Metadatos */
        .article-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            color: var(--color-texto-claro);
            font-size: 0.95em;
            flex-wrap: wrap;
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-meta i {
            color: var(--color-secundario);
        }

        /* Título */
        .article-title {
            font-size: var(--tamano-titulo-articulo);
            margin-bottom: 15px;
            line-height: 1.4;
            font-family: var(--fuente-titulos);
        }

        .article-title a {
            color: var(--color-primario);
            text-decoration: none;
            transition: color 0.3s;
        }

        .article-title a:hover {
            color: var(--color-secundario);
        }

        /* Extracto */
        .article-excerpt {
            color: var(--color-texto-claro);
            margin-bottom: 20px;
            font-size: var(--tamano-texto);
            line-height: 1.8;
        }

        /* Botón leer más */
        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--color-secundario);
            text-decoration: none;
            font-weight: 600;
            transition: gap 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        .read-more:hover {
            gap: 15px;
        }

        /* ===== ESTADOS ===== */
        .loading, .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: var(--borde-radio);
            box-shadow: var(--sombra-suave);
        }

        .loading i {
            font-size: 3em;
            color: var(--color-secundario);
            margin-bottom: 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state i {
            font-size: 5em;
            color: var(--color-secundario);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 2em;
            color: var(--color-primario);
            margin-bottom: 15px;
        }

        .empty-state p {
            color: var(--color-texto-claro);
            max-width: 500px;
            margin: 0 auto;
        }

        /* ===== FOOTER ===== */
        .site-footer {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto-claro);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .footer-links a {
            color: var(--color-texto-claro);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--color-secundario);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --tamano-titulo-site: 2.5em;
                --tamano-titulo-articulo: 1.8em;
            }
            
            .toolbar {
                flex-direction: column;
                text-align: center;
                border-radius: 20px;
            }
            
            .article-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>Brus leguas</h1>
        <p>blog de brusleguas
    </header>

    <div class="container">
        <div class="toolbar">
            <div class="blog-title">
                <i class="fas fa-pen-fancy"></i> 
                Publicaciones recientes
            </div>
            <a href="admin.html" class="admin-link">
                <i class="fas fa-lock"></i>
                Panel de Administración
            </a>
        </div>

        <div id="articlesList" class="articles">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Cargando publicaciones...</p>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>brus leguas</p>
        <p style="font-size: 0.9em;">© 2025 · Todos los derechos reservados</p>
        <div class="footer-links">
            <a href="#"><i class="fas fa-rss"></i> RSS</a>
            <a href="#"><i class="fab fa-twitter"></i> Twitter</a>
            <a href="#"><i class="fas fa-envelope"></i> Contacto</a>
        </div>
    </footer>

    <script>
        // ===== CONFIGURACIÓN - EDITA AQUÍ TUS DATOS =====
        const BLOG_CONFIG = {
            user: 'jalilamado99-spec',        // TU USUARIO DE GITHUB
            repo: 'brusleguas.github.io',     // TU REPOSITORIO
            branch: 'main'                     // RAMA (casi siempre main)
        };

        // URL base para archivos
        const BASE_URL = `https://raw.githubusercontent.com/${BLOG_CONFIG.user}/${BLOG_CONFIG.repo}/${BLOG_CONFIG.branch}`;

        // ===== FUNCIÓN PRINCIPAL PARA CARGAR ARTÍCULOS =====
        async function cargarArticulos() {
            const articlesList = document.getElementById('articlesList');
            
            try {
                console.log('Intentando cargar artículos desde:', `${BASE_URL}/posts/lista.json`);
                
                // 1. Intentar cargar la lista de artículos
                const response = await fetch(`${BASE_URL}/posts/lista.json`);
                
                if (!response.ok) {
                    console.log('No se encontró lista.json, mostrando mensaje de bienvenida');
                    articlesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-feather-alt"></i>
                            <h2>Bienvenido a brus leguas</h2>
                            <p>Este espacio está en construcción. Accede al panel de administración para comenzar a publicar.</p>
                            <p style="margin-top: 20px; color: var(--color-secundario);">
                                <i class="fas fa-arrow-right"></i> 
                                <a href="admin.html" style="color: var(--color-secundario);">Ir al panel</a>
                            </p>
                        </div>
                    `;
                    return;
                }

                // 2. Parsear la lista de artículos
                const articulos = await response.json();
                console.log('Artículos encontrados:', articulos);
                
                if (!articulos || articulos.length === 0) {
                    articlesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-book-open"></i>
                            <h2>No hay publicaciones aún</h2>
                            <p>Próximamente encontrarás contenido interesante aquí.</p>
                        </div>
                    `;
                    return;
                }

                // 3. Ordenar por fecha (más reciente primero)
                articulos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                // 4. Construir el HTML de los artículos
                let html = '';
                
                for (let i = 0; i < articulos.length; i++) {
                    const art = articulos[i];
                    
                    try {
                        // Cargar cada artículo individual
                        const artResponse = await fetch(`${BASE_URL}/posts/${art.slug}.json`);
                        
                        if (artResponse.ok) {
                            const articuloCompleto = await artResponse.json();
                            
                            // Crear resumen (primeros 250 caracteres sin HTML)
                            const textoPlano = articuloCompleto.contenido
                                .replace(/<[^>]*>/g, ' ')
                                .replace(/\s+/g, ' ')
                                .trim();
                            
                            const resumen = textoPlano.length > 250 
                                ? textoPlano.substring(0, 250) + '...'
                                : textoPlano;
                            
                            // Formatear fecha
                            const fecha = new Date(art.fecha);
                            const fechaFormateada = fecha.toLocaleDateString('es-ES', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });

                            // Calcular tiempo de lectura (aprox)
                            const palabras = textoPlano.split(' ').length;
                            const minutosLectura = Math.max(1, Math.ceil(palabras / 200));

                            html += `
                                <article class="article-card">
                                    <div class="article-meta">
                                        <span>
                                            <i class="fas fa-calendar-alt"></i>
                                            ${fechaFormateada}
                                        </span>
                                        <span>
                                            <i class="fas fa-user"></i>
                                            ${articuloCompleto.autor || 'Editorial'}
                                        </span>
                                        <span>
                                            <i class="fas fa-clock"></i>
                                            ${minutosLectura} min lectura
                                        </span>
                                    </div>
                                    <h2 class="article-title">
                                        <a href="post.html?slug=${art.slug}">
                                            ${articuloCompleto.titulo}
                                        </a>
                                    </h2>
                                    <div class="article-excerpt">
                                        ${resumen}
                                    </div>
                                    <a href="post.html?slug=${art.slug}" class="read-more">
                                        LEER ARTÍCULO COMPLETO 
                                        <i class="fas fa-arrow-right"></i>
                                    </a>
                                </article>
                            `;
                        }
                    } catch (e) {
                        console.warn(`Error cargando artículo ${art.slug}:`, e);
                    }
                }

                // 5. Mostrar los artículos o mensaje de error
                if (html) {
                    articlesList.innerHTML = html;
                } else {
                    articlesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h2>Error al cargar</h2>
                            <p>No se pudieron cargar los artículos. Intenta más tarde.</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error general:', error);
                articlesList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Error de conexión</h2>
                        <p>No se pudo conectar con GitHub. Verifica tu conexión.</p>
                        <p style="margin-top: 15px; font-size: 0.9em;">
                            Repositorio: ${BLOG_CONFIG.user}/${BLOG_CONFIG.repo}
                        </p>
                    </div>
                `;
            }
        }

        // ===== INICIAR CARGA =====
        document.addEventListener('DOMContentLoaded', cargarArticulos);
    </script>
</body>
</html>
